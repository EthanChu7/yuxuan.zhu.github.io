{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="theme-color" content="#fafafc"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<script>
  (function () {
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const statusBarStyle = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');

    const syncBrowserChrome = function () {
      const storedTheme = localStorage.getItem("theme");
      const darkMode = document.documentElement.getAttribute("data-theme") === "dark" ||
        (!document.documentElement.hasAttribute("data-theme") &&
          (storedTheme === "dark" ||
            (storedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)));

      themeColor.setAttribute("content", darkMode ? "#161617" : "#fafafc");
      statusBarStyle.setAttribute("content", darkMode ? "black-translucent" : "default");
    };

    syncBrowserChrome();

    new MutationObserver(syncBrowserChrome).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"],
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncBrowserChrome);
  })();
</script>

<!-- end custom head snippets -->
